<!doctype html>
<!-- Latest compiled and minified CSS -->
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
<!-- jQuery library -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
<!-- Latest compiled JavaScript -->
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
<head lang="en">
    <meta charset="utf-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
</head>
<title>Led Strip</title>

<body>

<div class="container">
  <nav class="navbar navbar-default">
    <div class="navbar-header">
    <a class="navbar-brand" href="/">PI HOME</a>
    </div>
    <ul class="nav navbar-nav">
    <li {% if page == 'home' %} class="active" {% endif %}><a href="/">Home</a></li>
    {% for i in rooms %}
    <li {% if i == roomID %} class="active" {% endif %}><a href="/rooms/{{i}}">{{i}}</a></li>
    {% endfor %}
    <li {% if page == 'graphs' %} class="active" {% endif %}><a href="/graphs">Graphs</a></li>
    </ul>
  </nav>
  <div class="jumbotron">
    <h1>Raspberry pi user interface</h1> 
  </div>

  {% include page + '.html'%}

</div>

</body>
</html>
